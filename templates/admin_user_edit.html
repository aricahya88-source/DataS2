{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>Edit Akun Prodi</h1><p>Ubah identitas akun, mapping Prodi, atau reset password.</p></div></div><div class="card section-card" style="max-width:760px"><form method="post"><div class="form-grid"><div class="field"><label>Username</label><input class="input" name="username" value="{{ user.username }}" required></div><div class="field"><label>Nama tampilan</label><input class="input" name="display_name" value="{{ user.display_name }}" required></div><div class="field full"><label>Mapping Prodi</label><select class="select" name="prodi_id" required>{% for p in prodis %}<option value="{{ p.id }}" {{ 'selected' if p.id==user.prodi_id else '' }}>{{ p.kode_prodi }} — {{ p.nama_prodi }}</option>{% endfor %}</select></div><div class="field full"><label>Password baru (opsional)</label><input class="input" type="password" name="new_password"><div class="help">Isi hanya jika ingin reset password.</div></div></div><div class="action-row" style="margin-top:14px"><button class="btn btn-primary">Simpan Perubahan</button><a class="btn btn-secondary" href="{{ url_for('admin_users') }}">Batal</a></div></form></div>{% endblock %}
